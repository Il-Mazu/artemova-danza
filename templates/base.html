{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ArteMova Danza{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">ArteMova Danza</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">Chi siamo</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'school_list' %}">Scuole</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'dayoftheweek_list' %}">Giorni</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'classroom_list' %}">Aule</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'course_list' %}">Corsi</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Via Verdi 18, Reggio Emilia, 42121</p>
        <p>Tel: 0522 331455</p>
        <p>Email: <a href="mailto:info@artemovadanza.it">info@artemovadanza.it</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
