{% extends "base.html" %}
{% block content %}
    <h1>{% block list-title %}Lista{% endblock %}</h1>
    {% if object_list %}
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    {% block list-header %}
                        <th>Nome</th>
                    {% endblock %}
                </tr>
            </thead>
            <tbody>
                {% block list-body %}{% endblock %}
            </tbody>
        </table>
    {% else %}
        <p>Nessun elemento trovato.</p>
    {% endif %}
    {% block list-footer %}{% endblock %}
{% endblock %}
