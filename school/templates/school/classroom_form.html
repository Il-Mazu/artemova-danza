{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}
    {% if object %}Modifica Aula{% else %}Nuova Aula{% endif %}
{% endblock %}
{% block content %}
    {% if object %}
        <h1>Modifica Aula</h1>
    {% else %}
        <h1>Nuova Aula</h1>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Salva</button>
        <a href="{% url 'classroom_list' %}" class="btn btn-secondary">Annulla</a>
    </form>
{% endblock %}
