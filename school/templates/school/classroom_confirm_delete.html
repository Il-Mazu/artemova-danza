{% extends "base.html" %}
{% block title %}Elimina Aula{% endblock %}
{% block content %}
    <h1>Conferma Eliminazione</h1>
    <p>Sei sicuro di voler eliminare l'aula <strong>{{ object.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Elimina</button>
        <a href="{% url 'classroom_list' %}" class="btn btn-secondary">Annulla</a>
    </form>
{% endblock %}
